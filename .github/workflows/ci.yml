name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang
        run: sudo apt-get install -y clang
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Differential tests
        run: python tests/differential/run_differential.py --numlangc numlangc --cc clang
      - name: Capability matrix structure
        run: python scripts/check_capabilities.py --language numlang --require-complete
